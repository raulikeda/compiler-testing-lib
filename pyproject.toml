[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compiler-testing-lib"
version = "0.2.0"
description = "A testing library for running language/compiler tests from YAML metadata, with a reference transpiler for the course language."
readme = "README.md"
authors = [{ name = "Raul Ikeda" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["compiler_testing_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=compiler_testing_lib.transpiler --cov-report=term --cov-fail-under=80"
markers = [
    "toolchain: needs the real target toolchain (go/julia) on PATH; skipped otherwise",
]

[tool.coverage.report]
skip_covered = true
show_missing = true
